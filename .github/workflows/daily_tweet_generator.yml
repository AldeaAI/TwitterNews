name: Daily Tweet Generator

on:
  schedule:
    - cron: '0 8 * * *' # Runs at 8:00 AM UTC every day
  workflow_dispatch: # Allows manual triggering

jobs:
  generate-tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tweet generator
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python main.py

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions-bot@github.com'

      # - name: Commit and push history file
      #   run: |
      #     git add post_history.json
      #     # Check for changes before committing
      #     if ! git diff --quiet --exit-code post_history.json; then
      #       git commit -m "Update post history"
      #       git push
      #     else
      #       echo "No changes to post_history.json to commit."
      #     fi

      - name: update history file
        run: |
          pwd
          git config --global user.email "AldeaAI@protonmail.com"
          git config --global user.name "AldeaAI"
          git add -A 
          git commit -m 'Update post history'
          git push          